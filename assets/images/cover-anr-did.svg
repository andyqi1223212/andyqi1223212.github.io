<text x="37" y="144" fill="#9c553a" font-size="48" font-weight="700" font-family="Arial, sans-serif">+15.1%</text><text x="36" y="177" fill="#986b5b" font-size="20" font-family="Arial, sans-serif">观察到的 GTV 增长</text>
